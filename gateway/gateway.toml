# teale-gateway config — deployed at gateway.teale.com.
#
# Secret bearer tokens are loaded from the GATEWAY_TOKENS env var at startup
# (format: "tok_abc:openrouter,tok_dev:internal"). Rotate via `fly secrets set`.

bind = "0.0.0.0:8080"
display_name = "teale-gateway"
identity_path = "/data/gateway-identity.key"
models_yaml = "/app/models.yaml"

[relay]
url = "wss://relay.teale.com/ws"

[scheduler]
max_queue_depth = 8
swap_penalty = 0.3
tps_weight = 1.0

[scheduler.per_model_floor]
# 2026-04-21: small=1 so single-supplier models (qwen3-32b on tailor64,
# qwen3.6-35b-a3b on tailor96, hermes-3-8b on tailor16) all appear on
# /v1/models for the Kimi K2.6 public launch. Trade-off: if a sole
# supplier drops, the model still shows until the heartbeat prunes it.
# Raise back to 2 once we have ≥2 nodes carrying each small model.
large = 1
small = 1

[reliability]
request_timeout_seconds = 300
# TTFT deadline covers relay-open + first-token latency. Hermes/tool-agent
# prompts routinely prefill 15k-60k tokens on single-supplier Macs, so WAN
# reliability needs a much wider first-token window than tiny chat probes.
# DeepSeek V4 Flash and Qwen3-Coder-Next can cold-prefill well past 30s while
# still being healthy; do not quarantine them before they have a chance to
# produce the first token.
ttft_deadline_seconds = 120
# Qwen3.6/Gemma-class "small" agent prompts are also larger than chat probes.
# Qwen3.6 on tailor96 measured ~13s TTFT for a 19k-token Hermes prompt, and
# Gemma on the 64 GB node can exceed the old 8s fail-fast limit under the real
# Hermes system prompt.
small_ttft_deadline_seconds = 60
max_retries = 1
# Teale's supply-side WAN stack has no direct node→relay heartbeat — it
# only re-registers every 240 s (WANDiscovery.startReregistration), and in
# practice we've observed even that periodic register not reliably reaching
# the gateway (the Task-based loop appears to silently exit in some Swift
# 6.3 concurrency paths; needs real fix upstream). Until the re-register is
# reliable or a proper node→relay heartbeat is added, set this generous so
# one successful initial register keeps a device eligible for an hour —
# better than flapping every supplier out of the catalog every 30 s.
heartbeat_stale_seconds = 3600
quarantine_seconds = 120
discover_interval_seconds = 60
# Heavy-hold (#247): never co-schedule two "heavy" requests on one node. A
# request is heavy when its prompt is at least heavy_hold_prompt_tokens OR its
# requested max_tokens is at least heavy_hold_max_tokens. A second heavy aimed
# at an occupied node is refused with a retriable 503 (heavy_contention) so
# the fleet's backoff-retry re-attempts it; light traffic still co-schedules
# and prefers nodes without an in-flight heavy.
heavy_hold = true
heavy_hold_prompt_tokens = 30000
heavy_hold_max_tokens = 4096
# Extra first-token allowance for a light request admitted beside an
# in-flight heavy: its slow first token is contention on a live device,
# not failure - the deadline is extended and quarantine is skipped for
# that attempt.
heavy_co_resident_ttft_bonus_seconds = 180

[synthetic_probes]
# Keep /v1/models TTFT/TPS from going stale when real traffic is quiet.
# These probes only hit idle, loaded suppliers, use a tiny prompt, and
# bypass wallet settlement. With the current 30-minute cadence the cost is
# low enough to keep Kimi/GLM-class models fresh without materially stealing
# capacity from user traffic.
enabled = true
interval_seconds = 1800
max_tokens = 16

[solana]
# Deposit verification uses finalized Solana RPC data and credits only the
# verified USDC delta into the account wallet. Override these for devnet or a
# dedicated RPC provider when needed.
rpc_url = "https://api.mainnet-beta.solana.com"
usdc_mint = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
commitment = "finalized"
request_timeout_seconds = 15
max_supported_transaction_version = 0
treasury_address = "HwGY6RJKzAxoRjeqWYvmnZGu4AC8oyEzqFrpGgqAKzhA"
withdrawal_fee_bps = 180

[apmhelp]
# apmhelp employee-supply lane (#272): requests from members/staff of this
# PIN may draw on the confirmed-employee set below, strictly preferred over
# fleet supply. Empty pin_id disables the lane (the supply set stays
# inert). Confirmation is manual per machine on Taylor's word - relay
# registration is unauthenticated (#252), display names prove nothing.
