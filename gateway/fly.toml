app = "teale-gateway"
primary_region = "sjc"
kill_signal = "SIGINT"
# Graceful drain (main.rs shutdown_signal): on SIGINT the gateway stops
# accepting connections and lets in-flight requests and SSE streams finish.
# 300s is fly's maximum kill_timeout; it covers the 300s request_timeout
# but not the longest sole-supplier streams (first-token ceiling 1500s, node
# stream budget 1800s), which a deploy can still cut.
kill_timeout = 300

[build]
dockerfile = "Dockerfile"

[env]
RUST_LOG = "info"

[[mounts]]
source = "gateway_data"
destination = "/data"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1   # per-machine SQLite volumes: a second machine boots onto a stale volume = split-brain; keep 1 until the HA story is real

[[http_service.checks]]
grace_period = "10s"
interval = "15s"
method = "GET"
timeout = "3s"
path = "/health"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 1024
