[package]
name = "teale-cli"
description = "teale - command line for the Teale desktop app and supply node"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "teale"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
fs2 = "0.4.3"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde"] }
# Deliberately not `reqwest.workspace = true`: the workspace entry also
# enables `native-tls` and `stream` for the gateway, and workspace
# inheritance can only add features. This keeps the standalone `teale`
# binary (released via `cargo build -p teale-cli`) rustls-only.
# Keep the version in step with [workspace.dependencies].
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
serde_yaml = "0.9.34"
tempfile = "3.27.0"
tokio.workspace = true
toml_edit = { version = "0.25.15", features = ["serde"] }
yaml-edit = "0.3.2"
