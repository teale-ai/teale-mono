name: relay-deploy

on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay-deploy.yml"

jobs:
  fly-deploy:
    runs-on: ubuntu-latest
    # Only auto-deploy from main. Manual dispatch for testing branches.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: deploy
        # relay/Dockerfile COPYs package.json/server.ts relative to the build
        # context, so run from the relay directory (context = relay/).
        working-directory: relay
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.toml --dockerfile Dockerfile
