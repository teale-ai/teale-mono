name: android

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v6

      # AGP 8.5 / Gradle 8.9 / Kotlin 1.9 all target JDK 17.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Debug variant only: release signing needs keystore.properties or the
      # TEALE_RELEASE_* secrets, which PR builds never get.
      - name: Unit tests, lint, debug APK
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Upload lint + test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android-app/app/build/reports/
            android-app/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
