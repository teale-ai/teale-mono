name: relay

on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with relay/Dockerfile (oven/bun:<version>).
          bun-version: 1.3.11
      - run: bun install
      - name: Type-check
        run: bun run typecheck
      - name: Tests
        run: bun test
