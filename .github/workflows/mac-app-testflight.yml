name: TestFlight

# Archives TealeCompanion and uploads it to TestFlight.
#
# Requires these repository secrets (see mac-app/docs/apple-deployment.md):
#   IOS_DISTRIBUTION_P12_BASE64, IOS_DISTRIBUTION_P12_PASSWORD,
#   IOS_APPSTORE_PROFILE_BASE64, APPSTORE_API_KEY_ID, APPSTORE_API_KEY_P8,
#   APPSTORE_API_ISSUER_ID, APPLE_TEAM_ID, KEYCHAIN_PASSWORD
# Until all of them are configured the job succeeds with a notice and skips
# the signing/upload steps, instead of failing on empty secrets.

on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']

jobs:
  upload:
    # mlx-swift-lm (pulled in by Package.swift) needs Swift >= 6.1, which
    # ships on macos-15 (macos-14 has Swift 5.10). Matches mac-app.yml.
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac-app
    steps:
      - name: Check required secrets
        id: secrets
        working-directory: .
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=""
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD \
                      IOS_APPSTORE_PROFILE_BASE64 APPSTORE_API_KEY_ID \
                      APPSTORE_API_KEY_P8 APPSTORE_API_ISSUER_ID \
                      APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::notice title=TestFlight skipped::Missing repository secrets:${missing}. Add them under Settings > Secrets and variables > Actions (see mac-app/docs/apple-deployment.md) to enable TestFlight uploads."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - name: Select Xcode
        if: steps.secrets.outputs.ready == 'true'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Import Apple Distribution certificate
        if: steps.secrets.outputs.ready == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_P12_BASE64" | base64 -d > /tmp/ios-cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/ios-cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/ios-cert.p12

      - name: Install provisioning profile
        if: steps.secrets.outputs.ready == 'true'
        env:
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/teale-companion.mobileprovision

      - name: Write App Store Connect API key
        if: steps.secrets.outputs.ready == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          api_key_dir="$HOME/.appstoreconnect/private_keys"
          api_key_path="$api_key_dir/AuthKey_${API_KEY_ID}.p8"
          mkdir -p "$api_key_dir"
          printf '%s\n' "$API_KEY_P8" > "$api_key_path"
          chmod 600 "$api_key_path"
          # altool looks in ~/.appstoreconnect/private_keys; hand the same
          # path to upload-testflight.sh.
          echo "API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Archive, export, and upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: ./scripts/upload-testflight.sh
