name: Linux Desktop Release

# Builds the Linux desktop bundle (teale-node + teale-tray + llama-server at
# the version pinned in .github/llama-cpp-version).
#
# Triggered by:
#   - desktop-release.yml (workflow_call) for `teale-*` tags; that workflow
#     creates the GitHub release once before this and the Windows build run
#   - manual dispatch (uploads a workflow artifact only)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build Teale Linux desktop bundle
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-desktop-release

      - name: Build teale-node and teale-tray (release)
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu -p teale-node
          cargo build --release --target x86_64-unknown-linux-gnu -p teale-tray

      - name: Download llama-server (CPU build)
        run: |
          LLAMA_RELEASE="$(tr -d '[:space:]' < .github/llama-cpp-version)"
          if ! printf '%s' "${LLAMA_RELEASE}" | grep -Eq '^b[0-9]+$'; then
            echo "::error::.github/llama-cpp-version must contain a llama.cpp tag like b8840, got '${LLAMA_RELEASE}'"
            exit 1
          fi
          echo "llama.cpp release: ${LLAMA_RELEASE}"
          LLAMA_URL="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_RELEASE}/llama-${LLAMA_RELEASE}-bin-ubuntu-x64.tar.gz"
          mkdir -p .build/linux-downloads
          curl --retry 6 --retry-all-errors --retry-delay 5 -fsSL \
            "${LLAMA_URL}" \
            -o .build/linux-downloads/llama.tar.gz
          tar -xzf .build/linux-downloads/llama.tar.gz -C .build/linux-downloads
          LLAMA_SERVER_PATH="$(find .build/linux-downloads -type f -name llama-server -print -quit)"
          test -n "${LLAMA_SERVER_PATH}"
          cp "${LLAMA_SERVER_PATH}" .build/linux-downloads/llama-server
          chmod +x .build/linux-downloads/llama-server

      - name: Assemble Linux desktop bundle
        env:
          TEALE_SUPABASE_URL: ${{ secrets.TEALE_SUPABASE_URL }}
          TEALE_SUPABASE_ANON_KEY: ${{ secrets.TEALE_SUPABASE_ANON_KEY }}
          TEALE_SUPABASE_REDIRECT_URL: ${{ secrets.TEALE_SUPABASE_REDIRECT_URL }}
        run: |
          mkdir -p .build
          node/linux-desktop/build-package.sh \
            target/x86_64-unknown-linux-gnu/release/teale-node \
            target/x86_64-unknown-linux-gnu/release/teale-tray \
            .build/linux-downloads/llama-server \
            .build/Teale-linux-x86_64
          tar -C .build -czf .build/Teale-linux-x86_64.tar.gz Teale-linux-x86_64
          # Bare file name so `sha256sum -c` works next to the downloaded asset.
          (cd .build && sha256sum Teale-linux-x86_64.tar.gz > Teale-linux-x86_64-checksums.txt)

      - name: Upload Linux desktop bundle
        uses: actions/upload-artifact@v7
        with:
          # ref_name can contain slashes on branch builds; use the run id.
          name: Teale-linux-run-${{ github.run_id }}
          path: |
            .build/Teale-linux-x86_64.tar.gz
            .build/Teale-linux-x86_64-checksums.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release is created once by desktop-release.yml before this
          # job starts; never create it here (that raced the Windows job).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub release $TAG does not exist; tag builds must run through desktop-release.yml"
            exit 1
          fi
          gh release upload "$TAG" \
            .build/Teale-linux-x86_64.tar.gz \
            .build/Teale-linux-x86_64-checksums.txt \
            --clobber
