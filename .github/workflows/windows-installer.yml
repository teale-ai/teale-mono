name: Windows installer (Teale.exe)

# Builds the partner-pilot Windows installer:
#   - cargo builds teale-node.exe + teale-tray.exe (x86_64-pc-windows-msvc);
#     either build failing fails the job
#   - downloads llama-server (Vulkan backend) at the version pinned in
#     .github/llama-cpp-version
#   - stages all artifacts next to the .iss script and compiles with ISCC,
#     passing /DAppVer=<version> (tag minus "teale-" on release builds)
#   - uploads Teale.exe + checksums as workflow artifacts
#   - uploads the installer to the GitHub release on tag builds
#
# Triggered by:
#   - desktop-release.yml (workflow_call) for `teale-*` tags; that workflow
#     creates the GitHub release once before this and the Linux build run,
#     so the two never race to create it
#   - manual dispatch from the Actions tab (for testing the pipeline; only
#     uploads a workflow artifact, never touches a release)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build Teale.exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Derive installer version
        id: version
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF.StartsWith("refs/tags/")) {
            $tag = $env:REF.Substring("refs/tags/".Length)
            if (-not $tag.StartsWith("teale-")) {
              throw "Release builds expect a teale-* tag, got '$tag'"
            }
            $ver = $tag.Substring("teale-".Length)
            # Inno Setup / Windows version resources need 1-4 numeric parts,
            # each 0..65535 (teale-YYYY.MM.DD.HHMM fits).
            if ($ver -notmatch '^\d+(\.\d+){0,3}$') {
              throw "Cannot derive an installer version from tag '$tag' (expected teale-YYYY.MM.DD.HHMM)"
            }
            foreach ($part in $ver.Split('.')) {
              if ([int64]$part -gt 65535) {
                throw "Version part '$part' in tag '$tag' exceeds 65535"
              }
            }
          } else {
            # Dev build (manual dispatch): obviously-not-a-release version.
            $ver = "0.0.0.$([int64]$env:RUN_NUMBER % 65536)"
          }
          Write-Host "Installer version: $ver"
          "app_ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Read pinned llama.cpp version
        shell: pwsh
        run: |
          $llama = (Get-Content ".github\llama-cpp-version" -Raw).Trim()
          if ($llama -notmatch '^b\d+$') {
            throw ".github/llama-cpp-version must contain a single llama.cpp tag like b8840, got '$llama'"
          }
          Write-Host "llama.cpp release: $llama"
          "LLAMA_RELEASE=$llama" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release

      - name: Build teale-node.exe and teale-tray.exe (release)
        shell: pwsh
        run: |
          # Separate builds keep each binary's feature set identical to a
          # standalone build; check each exit code explicitly because pwsh
          # does not stop on a failing native command.
          cargo build --release --target x86_64-pc-windows-msvc -p teale-node
          if ($LASTEXITCODE -ne 0) { throw "cargo build -p teale-node failed ($LASTEXITCODE)" }
          cargo build --release --target x86_64-pc-windows-msvc -p teale-tray
          if ($LASTEXITCODE -ne 0) { throw "cargo build -p teale-tray failed ($LASTEXITCODE)" }

      - name: Download llama-server (Vulkan build)
        shell: pwsh
        run: |
          function Download-WithRetry {
            param([string[]]$Urls, [string]$OutFile)
            foreach ($url in $Urls) {
              for ($i = 1; $i -le 3; $i++) {
                try {
                  Invoke-WebRequest -Uri $url -OutFile $OutFile -UseBasicParsing -TimeoutSec 120
                  Write-Host "  Downloaded from $url (attempt $i)"
                  return
                } catch {
                  Write-Host "  Attempt $i from $url failed: $($_.Exception.Message)"
                  Start-Sleep -Seconds ($i * 5)
                }
              }
            }
            throw "All download URLs exhausted: $($Urls -join ', ')"
          }

          $llamaZip = "$env:RUNNER_TEMP\llama-vulkan.zip"
          $llamaExtract = "$env:RUNNER_TEMP\llama"
          $urls = @(
            "https://github.com/ggml-org/llama.cpp/releases/download/$env:LLAMA_RELEASE/llama-$env:LLAMA_RELEASE-bin-win-vulkan-x64.zip"
          )
          Download-WithRetry -Urls $urls -OutFile $llamaZip
          Expand-Archive -Path $llamaZip -DestinationPath $llamaExtract -Force
          $llamaServer = Get-ChildItem -Path $llamaExtract -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          if (-not $llamaServer) { throw "llama-server.exe not found in extracted archive" }
          Copy-Item -Path $llamaServer.FullName -Destination "node\installer\llama-server.exe" -Force
          # Copy all DLLs from the same directory (Vulkan runtime + GGML backends)
          $srcDir = Split-Path $llamaServer.FullName
          Get-ChildItem -Path $srcDir -Filter "*.dll" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "node\installer\" -Force
          }

      - name: Install NSSM (via Chocolatey)
        shell: pwsh
        run: |
          # nssm.cc has been 503-ing all afternoon, so we pull NSSM from
          # Chocolatey's CDN instead. Pre-installed on windows-latest.
          choco install nssm -y --no-progress
          # Never stage the Chocolatey shim from C:\ProgramData\chocolatey\bin.
          # We need the real NSSM binary from the package payload.
          $candidateRoots = @(
            "C:\ProgramData\chocolatey\lib\nssm\tools",
            "C:\ProgramData\chocolatey\lib\NSSM\tools"
          )
          $nssm = $null
          foreach ($root in $candidateRoots) {
            if (-not (Test-Path $root)) { continue }
            $preferred = Join-Path $root "win64\nssm.exe"
            if (Test-Path $preferred) {
              $nssm = Get-Item $preferred
              break
            }

            $fallback = Get-ChildItem -Path $root -Recurse -Filter "nssm.exe" |
              Where-Object { $_.FullName -notmatch "\\chocolatey\\bin\\" } |
              Sort-Object FullName |
              Select-Object -First 1
            if ($fallback) {
              $nssm = $fallback
              break
            }
          }

          if (-not $nssm) { throw "real nssm.exe not found after choco install" }

          Copy-Item -Path $nssm.FullName -Destination "node\installer\nssm.exe" -Force
          $staged = Get-Item "node\installer\nssm.exe"
          Write-Host "NSSM staged from $($nssm.FullName)"
          Write-Host "Staged NSSM size: $($staged.Length) bytes"

          if ($staged.Length -lt 100000) {
            throw "staged nssm.exe looks too small to be the real binary: $($staged.Length) bytes"
          }

      - name: Stage teale-node.exe + teale-tray.exe
        shell: pwsh
        run: |
          foreach ($bin in @("teale-node.exe", "teale-tray.exe")) {
            $src = "target\x86_64-pc-windows-msvc\release\$bin"
            if (-not (Test-Path $src)) { throw "$src missing after cargo build" }
            Copy-Item -Path $src -Destination "node\installer\$bin" -Force
          }

      # No Supabase config is staged: Supabase was decommissioned and Windows
      # sign-in goes through the gateway (/v1/auth/email/*) via teale-node.
      # The .iss lists supabase-config.json with skipifsourcedoesntexist.

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Chocolatey is pre-installed on windows-latest; it mirrors Inno
          # Setup reliably without depending on jrsoftware.org's CDN.
          choco install innosetup -y --no-progress
          # Verify ISCC is on PATH after install.
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $default = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $default)) { throw "ISCC.exe not found after choco install innosetup" }
          }

      - name: Compile installer (ISCC)
        shell: pwsh
        env:
          APP_VER: ${{ steps.version.outputs.app_ver }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APP_VER)) { throw "installer version was not derived" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVer=$env:APP_VER" "node\installer\teale-node-setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash "node\installer\output\Teale.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  Teale.exe" } |
            Set-Content "node\installer\output\checksums.txt"

      # TODO: signtool step once the Authenticode / EV cert is in repo secrets.
      # - name: Sign Teale.exe
      #   shell: pwsh
      #   env:
      #     CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
      #     CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      #   run: |
      #     $pfxPath = "$env:RUNNER_TEMP\cert.pfx"
      #     [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
      #     $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe"
      #     & $signtool sign /f $pfxPath /p $env:CERT_PASSWORD /tr http://timestamp.sectigo.com /td sha256 /fd sha256 "node\installer\output\Teale.exe"

      - name: Upload Teale.exe
        uses: actions/upload-artifact@v7
        with:
          # ref_name can contain slashes on branch builds (feat/foo) -
          # artifact names forbid them, so use a safe run label instead.
          name: Teale-run-${{ github.run_id }}-${{ steps.version.outputs.app_ver }}-unsigned
          path: |
            node/installer/output/Teale.exe
            node/installer/output/checksums.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release is created once by desktop-release.yml before this
          # job starts; never create it here (that raced the Linux job).
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release $env:TAG does not exist; tag builds must run through desktop-release.yml"
          }
          gh release upload $env:TAG `
            "node\installer\output\Teale.exe" `
            "node\installer\output\checksums.txt" `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }
